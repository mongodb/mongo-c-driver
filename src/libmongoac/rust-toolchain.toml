# Pin the Rust toolchain to the minimum supported Rust version (MSRV) declared
# by `rust-version` in Cargo.toml. Note: rustup resolves this file relative to
# the current working directory, so CMake-driven cargo invocations from the
# build directory do not honor it. CI reads `channel` from this file and selects
# the toolchain explicitly (see `.evergreen/scripts/install-rust-toolchain.sh`).
[toolchain]
channel = "1.88.0"
profile = "minimal"
# rustfmt and clippy are not part of the minimal profile, but are required by tools/cargo-format-all.sh and by local
# development. CI is unaffected: it exports RUSTUP_TOOLCHAIN, which takes precedence over this file.
components = ["rustfmt", "clippy"]
